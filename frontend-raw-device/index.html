<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Raw Device verifier</title>
  <!-- Shared design-system base, loaded from the shell's stable URL — SINGLE source of
       truth (no copy). It styles plain semantic HTML (inputs, buttons…) so this
       microfrontend needs NO knowledge of the shell's component classes. When composed
       into the shell via hx-select, the shell already loads the same base. -->
  <link rel="stylesheet" href="https://d24beiqs2cj89y.cloudfront.net/base.css" />
  <!-- htmx 2 flipped selfRequestsOnly to default TRUE, which blocks this portal's
       deliberate cross-origin GET to the daq device-status API (a different origin than
       this bucket). Allow it — matching the shell's htmx 1.9.x behaviour. Must precede
       the htmx script so it's read at init. -->
  <meta name="htmx-config" content='{"selfRequestsOnly":false}' />
  <script src="htmx.min.js"></script>
  <style>
    /* MFE-only page layout (not shell-coupled) — just centres the standalone view. */
    body { margin: 0; background: var(--bg-page); }
    #raw-device { max-width: 30rem; margin: 2.5rem auto; padding: 0 1rem; }
    #raw-device h1 { font-size: 1.25rem; color: var(--text-primary); margin: 0 0 1rem; }
    #rd-result { margin-top: .5rem; color: var(--text-muted); min-height: 1.25rem; }
  </style>
</head>
<body>
  <!-- Plain semantic HTML: the base stylesheet decorates it. The shell composes just
       this #raw-device div via hx-select. -->
  <div id="raw-device">
    <h1>Raw Device verifier</h1>
    <p id="rd-hint">Is a device sending data? Enter a customer ID (and optionally a meter
       ID) — this reads the raw device heartbeat, independent of decoding. Leave the meter
       blank to list every device reporting for that customer.</p>
    <!-- hx-get to the device-liveness read on the aggregations lambda (daq account),
         backed by the meter-liveness DynamoDB table. The gateway owns CORS; the lambda
         renders the #rd-result fragment. customerid is required; meterid narrows to one
         device. (Gateway isn't a key — a LoRaWAN uplink is heard by many gateways — so
         it's shown in the results, not searched.) -->
    <form id="rd-form"
          hx-get="https://zgjnztgi31.execute-api.eu-central-1.amazonaws.com/meterdata/query/get_liveness"
          hx-target="#rd-result"
          hx-select="#rd-result"
          hx-swap="outerHTML"
          hx-indicator="#rd-busy">
      <label for="rd-customerid">Customer ID</label>
      <input id="rd-customerid" name="customerid" required autocomplete="off"
             placeholder="e.g. danfoss" />
      <label for="rd-meterid">Meter ID <span class="muted">(optional)</span></label>
      <input id="rd-meterid" name="meterid" autocomplete="off"
             placeholder="e.g. the device / DevEUI id" />
      <button type="submit">Verify</button>
      <span id="rd-busy" class="htmx-indicator">checking…</span>
    </form>
    <div id="rd-result"></div>
  </div>
</body>
</html>

[package]
name = "model"
version = "0.1.0"
edition.workspace = true

[features]
testing = []
it = []
# Pulls the Athena measurements adapter (repository::measurements). Services that
# read measurements enable this; the hierarchy lambda doesn't, so it never
# compiles the Athena SDK.
athena = ["dep:aws-sdk-athena"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_dynamo.workspace = true
aws-config.workspace = true
aws-sdk-dynamodb.workspace = true
aws-sdk-cognitoidentityprovider.workspace = true
aws-sdk-athena = { workspace = true, optional = true }
typed-builder.workspace = true
strum.workspace = true
chrono.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
rand.workspace = true
utoipa.workspace = true

[dev-dependencies]
rstest.workspace = true
proptest.workspace = true
serial_test.workspace = true

[package]
name = "aggregations"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "aggregations"
path = "src/main.rs"

[dependencies]
lambda_http.workspace = true
tokio.workspace = true
aws-config.workspace = true
aws-sdk-dynamodb.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_dynamo.workspace = true
chrono.workspace = true
regex.workspace = true
anyhow.workspace = true
url.workspace = true
# /measurements route — reads all.raw_data via Amazon Athena (engine v3).
aws-sdk-athena.workspace = true
# Shared domain vocabulary (the `Resource` value type — same ubiquitous language
# as the hierarchy context, so it's shared, not duplicated).
model = { path = "../../model" }
# Shared typed response/error layer + OpenAPI schema derives.
api = { path = "../../api" }
utoipa.workspace = true
# Concurrent per-purpose query fan-out (try_join_all).
futures.workspace = true

[workspace]
resolver = "2"
members = ["crates/api", "crates/model", "crates/services/hierarchy", "crates/services/aggregations"]

[workspace.package]
edition = "2021"

[workspace.dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_dynamo = { version = "4", features = ["aws-sdk-dynamodb+1"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1"
aws-sdk-cognitoidentityprovider = "1"
typed-builder = "0.20"
strum = { version = "0.26", features = ["derive"] }
maud = "0.26"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
lambda_http = "0.13"
aws_lambda_events = "0.15"
rstest = "0.23"
proptest = "1"
serial_test = "3"
urlencoding = "2"
rand = "0.8"
regex = "1"
url = "2"
aws-sdk-athena = "1"
utoipa = "5"
futures = "0.3"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
